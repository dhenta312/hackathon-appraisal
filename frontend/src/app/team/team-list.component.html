<div class="page">
  <div class="page-header">
    <div>
      <h1 class="page-heading">Tim saya</h1>
      <p class="page-subtitle">Menilai rekan setim kamu</p>
    </div>
    <a class="pilar-btn-secondary" [routerLink]="['/results', myId]">Lihat hasil saya</a>
  </div>

  @if (loading()) {
    <p>Memuat...</p>
  } @else {
    <p class="progress">Sudah {{ doneCount }} dari {{ totalCount }} dinilai</p>

    @if (error) {
      <p class="error">{{ error }}</p>
    }

    <div class="member-list">
      @for (member of members(); track member.id) {
        <div class="member-card">
          <button class="member-main" (click)="openAssessment(member.id)">
            <span class="member-name">{{ member.name }}</span>
            <span class="member-role">{{ member.job_role_name }}</span>
            <span class="member-status" [class]="badgeClass(member.status)">{{ statusLabel(member.status) }}</span>
          </button>
          @if (isAdmin) {
            <button class="pilar-btn-secondary" (click)="viewResults(member.id)">Hasil</button>
          }
        </div>
      }
    </div>
  }
</div>
