<div class="team-container">
  <header class="team-header">
    <h1>Tim saya</h1>
    <div class="header-actions">
      <a class="my-results" [routerLink]="['/results', myId]">Lihat hasil saya</a>
      <button class="logout" (click)="logout()">Keluar</button>
    </div>
  </header>

  @if (loading()) {
    <p>Memuat...</p>
  } @else {
    <p class="progress">Sudah {{ doneCount }} dari {{ totalCount }} dinilai</p>

    @if (error) {
      <p class="error">{{ error }}</p>
    }

    <div class="members">
      @for (member of members(); track member.id) {
        <div class="member-card">
          <button class="member-main" (click)="openAssessment(member.id)">
            <span class="member-name">{{ member.name }}</span>
            <span class="member-role">{{ member.job_role_name }}</span>
            <span class="member-status">{{ statusLabel(member.status) }}</span>
          </button>
          @if (isAdmin) {
            <button class="member-results" (click)="viewResults(member.id)">Hasil</button>
          }
        </div>
      }
    </div>
  }
</div>
