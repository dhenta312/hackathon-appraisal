<div class="login-page">
  <div class="login-hero">
    <img src="image-59.png" alt="" />
  </div>

  <div class="login-content">
    <div class="login-card">
      <div class="login-lang">
        <span class="lang lang-active">
          <img src="flag-id.svg" alt="ID" />
          <span>ID</span>
        </span>
        <span class="lang">
          <img src="flag-us.svg" alt="EN" />
          <span>EN</span>
        </span>
      </div>

      <div class="login-logo">
        <img class="logo-mark-2" src="logo-mark-2.svg" alt="PILAR" />
        <img class="logo-mark-1" src="logo-mark-1.svg" alt="" />
      </div>

      <div class="login-heading">
        <h1>Masuk Penilaian Kinerja</h1>
        <p>Penilaian kinerja pegawai</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()" class="login-form">
        <div class="readonly-field">
          <span class="readonly-label">Masuk sebagai</span>
          <span class="readonly-value">Mahasiswa / Dosen / Tendik</span>
        </div>

        <div class="field">
          <label class="field-label" for="email">Email <span class="required">*</span></label>
          <input id="email" formControlName="email" type="email" placeholder="nama@example.com" autocomplete="email" />
        </div>

        <div class="field">
          <label class="field-label" for="password">Kata sandi <span class="required">*</span></label>
          <div class="password-wrap">
            <input id="password" formControlName="password" type="password" placeholder="Masukkan kata sandi" autocomplete="current-password" />
            <img class="field-icon" src="field-icon.svg" alt="" />
          </div>
          <div class="field-message">
            <img src="message-icon.svg" alt="" />
            <span>Lupa kata sandi? <a>Atur ulang kata sandi!</a></span>
          </div>
        </div>

        @if (error) {
          <p class="login-error">{{ error }}</p>
        }

        <button type="submit" class="submit-btn" [disabled]="form.invalid || submitting">
          <img src="arrow-right-to-bracket.svg" alt="" />
          <span>{{ submitting ? 'Memproses...' : 'Masuk' }}</span>
        </button>
      </form>

      <div class="login-divider">
        <img src="divider.svg" alt="" />
      </div>

      <div class="login-support">
        <span class="support-text">Hubungi IT Support</span>
        <a class="support-btn"><img src="whatsapp.svg" alt="WhatsApp" /></a>
        <a class="support-btn"><img src="envelope.svg" alt="Email" /></a>
      </div>
    </div>

    <footer class="login-footer">
      &copy; Badan Sistem Informasi Universitas Islam Indonesia
    </footer>
  </div>
</div>
