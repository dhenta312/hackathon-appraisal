<div class="app-shell">
  <header class="topbar">
    <div class="topbar-strip">
      <div class="strip-item">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 2h2l1 3.5L4.5 7a11 11 0 0 0 4.5 4.5L10.5 10 14 11v2a2 2 0 0 1-2 2A13 13 0 0 1 1 4a2 2 0 0 1 2-2z" />
        </svg>
        <span>IT Support</span>
      </div>
      <div class="strip-item">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 4h12v9H2zM2 5l6 5 6-5" />
        </svg>
        <span>IT Support</span>
      </div>
      <div class="strip-item">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="8" cy="8" r="6" />
          <path d="M2 8h12M8 2c2.5 2.5 2.5 9.5 0 12M8 2c-2.5 2.5-2.5 9.5 0 12" />
        </svg>
        <span>bsi.uii.ac.id</span>
      </div>
    </div>

    <div class="topbar-main">
      <div class="topbar-logo">
        <img class="logo-mark-2" src="logo-mark-2.svg" alt="UII" />
        <img class="logo-mark-1" src="logo-mark-1.svg" alt="" />
      </div>

      <button class="icon-btn" aria-label="Menu">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <rect x="3" y="3" width="6" height="6" rx="1" />
          <rect x="11" y="3" width="6" height="6" rx="1" />
          <rect x="3" y="11" width="6" height="6" rx="1" />
          <rect x="11" y="11" width="6" height="6" rx="1" />
        </svg>
      </button>

      <button class="icon-btn" aria-label="Notifikasi">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 6.7a5 5 0 0 0-10 0c0 6-2.5 7.5-2.5 7.5h15S15 12.7 15 6.7z" />
          <path d="M11.4 17.5a2 2 0 0 1-3.8-.5" />
        </svg>
        <span class="bell-badge">9</span>
      </button>

      <div class="lang-switch">
        <span class="lang lang-active">
          <img src="flag-id.svg" alt="ID" />
          <span>ID</span>
        </span>
        <span class="lang lang-idle">
          <img src="flag-us.svg" alt="EN" />
          <span>EN</span>
        </span>
      </div>

      <div class="user-area">
        <div class="avatar">{{ userInitial }}</div>
        <span class="user-name">{{ userName }}</span>
        <button class="logout-btn" (click)="logout()">Keluar</button>
      </div>
    </div>
  </header>

  <div class="app-body">
    <aside class="sidebar">
      <div class="sidebar-collapse" aria-hidden="true">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 5l-5 5 5 5M15 5l-5 5 5 5" />
        </svg>
      </div>
      <nav class="sidebar-menu">
        <a class="menu-item" routerLink="/welcome" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 10l7-7 7 7" />
            <path d="M5 9v9h10V9" />
          </svg>
          <span>Beranda</span>
        </a>
        <a class="menu-item" routerLink="/team" routerLinkActive="active">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="3" width="12" height="14" rx="2" />
            <path d="M8 3v3h4V3" />
          </svg>
          <span>Penilaian</span>
        </a>
      </nav>
    </aside>

    <main class="app-main">
      <div class="page-container">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
</div>
